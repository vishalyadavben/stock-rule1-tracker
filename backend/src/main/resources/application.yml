server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/rule1_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect   # or MySQL8Dialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-prod}
  expiration-ms: 86400000   # 24h

stock-api:
  provider: ${STOCK_API_PROVIDER:ALPHA_VANTAGE}   # ALPHA_VANTAGE | FMP
  api-key: ${STOCK_API_KEY:demo}
  base-url: ${STOCK_API_BASE_URL:https://www.alphavantage.co}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGIN:http://localhost:5173}
