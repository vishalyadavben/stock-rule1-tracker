server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rule1_tracker}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate    # Flyway owns schema changes; Hibernate only ever validates against it
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-prod}
  expiration-ms: 86400000   # 24h

stock-api:
  provider: ${STOCK_API_PROVIDER:ALPHA_VANTAGE}   # ALPHA_VANTAGE | FMP
  api-key: ${STOCK_API_KEY:demo}
  base-url: ${STOCK_API_BASE_URL:https://www.alphavantage.co}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGIN:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@rule1-tracker.local}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
